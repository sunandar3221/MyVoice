name: Latih Model AI CelerVoice di Cloud (Gratis & Cepat)

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Jumlah Epoch Pelatihan'
        required: true
        default: '80'
        type: string
      batch_size:
        description: 'Batch Size'
        required: true
        default: '4'
        type: string
      learning_rate:
        description: 'Learning Rate'
        required: true
        default: '0.002'
        type: string
  push:
    branches:
      - master
      - main

jobs:
  train-ai:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy scipy

      - name: 🚀 Latih Model AI CelerVoice v2
        run: |
          EPOCHS="${{ github.event.inputs.epochs || '80' }}"
          BATCH="${{ github.event.inputs.batch_size || '4' }}"
          LR="${{ github.event.inputs.learning_rate || '0.002' }}"
          echo "Memulai training di cloud GitHub Actions: $EPOCHS epoch, batch size $BATCH, threads 4..."
          python train.py --epochs $EPOCHS --batch_size $BATCH --lr $LR --threads 4

      - name: 🎙️ Uji Coba Sintesis Suara Hasil Training
        run: |
          python infer.py --text "halo selamat datang di sistem kecerdasan buatan suara buatan sendiri" --output test_cloud_eval.wav --no_play

      - name: 📤 Upload Model Checkpoint (.pt) & Audio Sampel
        uses: actions/upload-artifact@v4
        with:
          name: celervoice-model-checkpoint
          path: |
            checkpoints/best_model.pt
            test_cloud_eval.wav
            checkpoints/*.wav
